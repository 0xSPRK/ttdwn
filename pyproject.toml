[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttdwn"
version = "1.0.0"
description = "Minimal, strict TikTok downloader: no watermark, real quality selection, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ttdwn" }]
keywords = ["tiktok", "downloader", "no-watermark", "cli", "webui"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
webui = ["fastapi>=0.109", "uvicorn[standard]>=0.27", "pydantic>=2.5"]

[project.scripts]
ttdwn = "ttdwn.cli:main"

[project.urls]
Homepage = "https://example.invalid/ttdwn"

[tool.setuptools]
packages = ["ttdwn", "webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
