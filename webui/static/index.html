<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ttdwn - TikTok video downloader web UI">
  <title>ttdwn Web UI</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📥</text></svg>">
</head>
<body>
  <header class="top-app-bar" role="banner">
    <div class="top-app-bar__content">
      <h1 class="top-app-bar__title">ttdwn</h1>
      <div class="top-app-bar__actions">
        <button id="theme-toggle" class="icon-button" aria-label="Toggle theme" title="Toggle dark/light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content" role="main">
    <section class="download-section" aria-labelledby="download-heading">
      <h2 id="download-heading" class="visually-hidden">Download TikTok Video</h2>
      <div class="input-group">
        <label for="url-input" class="visually-hidden">TikTok URL</label>
        <input
          type="url"
          id="url-input"
          class="text-field"
          placeholder="Paste TikTok URL here..."
          aria-describedby="url-hint"
          autocomplete="url"
        >
        <div class="input-actions">
          <button id="paste-btn" class="button button--outlined" type="button" aria-label="Paste from clipboard">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19 2H11v2h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7V2zm-4 2v2h-4V4h4zm-6 4v14h14V6H9zm8 14H9V8h8v12z"/></svg>
            <span>Paste</span>
          </button>
          <button id="clear-btn" class="button button--outlined" type="button" aria-label="Clear input" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            <span>Clear</span>
          </button>
        </div>
      </div>
      <p id="url-hint" class="hint">Supports tiktok.com, vm.tiktok.com, vt.tiktok.com, m.tiktok.com links</p>
      <div class="options-row" role="group" aria-label="Download options">
        <select id="quality-select" class="select" aria-label="Video quality">
          <option value="best">Best quality (default)</option>
          <option value="worst">Smallest file</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="540">540p</option>
          <option value="480">480p</option>
        </select>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="watermark-check" value="true">
          <span class="checkbox-custom"></span>
          <span>Allow watermark</span>
        </label>
      </div>
      <button id="download-btn" class="button button--filled" type="button" disabled>
        <svg class="button__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Download</span>
      </button>
      <div id="progress-container" class="progress-container" hidden>
        <div class="linear-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Download progress">
          <div class="linear-progress__bar"></div>
        </div>
        <p id="progress-text" class="progress-text"></p>
      </div>
    </section>

    <section class="downloads-section" aria-labelledby="downloads-heading">
      <div class="section-header">
        <h2 id="downloads-heading" class="section-title">Downloads</h2>
        <button id="refresh-files" class="button button--outlined" type="button" aria-label="Refresh file list">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          <span>Refresh</span>
        </button>
      </div>
      <div id="files-list" class="file-list" role="list" aria-label="Downloaded files">
        <div class="empty-state" hidden>
          <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          <p>No downloads yet</p>
          <p class="hint">Paste a TikTok URL above to start downloading</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <a href="https://github.com/0xSPRK" target="_blank" rel="noopener noreferrer" class="footer__link">
      <svg class="footer__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
      <span>0xSPRK</span>
    </a>
    <p class="footer__note">Personal use only. Respect creators and TikTok's ToS.</p>
  </footer>

  <div id="snackbar" class="snackbar" role="alert" aria-live="polite" hidden>
    <span id="snackbar-text"></span>
    <button id="snackbar-dismiss" class="snackbar__dismiss" aria-label="Dismiss">×</button>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
